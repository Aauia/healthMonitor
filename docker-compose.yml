version: '3.8'

services:
  db:
    image: postgres:16
    container_name: health_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2006
      POSTGRES_DB: health_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Убедитесь, что файл backup.sql существует, если используете этот волюм
      # - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: health_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ссылка на хост 'db' (имя сервиса выше)
      DATABASE_URL: postgresql://postgres:hackathon123@db:5432/health_db
      SECRET_KEY: abc123supersecretkey
      ALGORITHM: HS256
      # Добавляем переменные, если они нужны коду
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: health_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: